<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffffff">
  <title>予約台帳 / Sổ đặt bàn</title>
  <link rel="stylesheet" href="style.css?v=24">
</head>
<body>
  <!-- dinii風 細線SVGアイコン定義 -->
  <svg style="display:none" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ic-calendar" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="17" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8" y1="2" x2="8" y2="6"/>
      <line x1="3" y1="10" x2="21" y2="10"/>
    </symbol>
    <symbol id="ic-list" viewBox="0 0 24 24">
      <line x1="8" y1="6" x2="21" y2="6"/>
      <line x1="8" y1="12" x2="21" y2="12"/>
      <line x1="8" y1="18" x2="21" y2="18"/>
      <line x1="3.5" y1="6" x2="3.51" y2="6"/>
      <line x1="3.5" y1="12" x2="3.51" y2="12"/>
      <line x1="3.5" y1="18" x2="3.51" y2="18"/>
    </symbol>
    <symbol id="ic-users" viewBox="0 0 24 24">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </symbol>
    <symbol id="ic-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </symbol>
    <symbol id="ic-plus" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>
    <symbol id="ic-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </symbol>
    <symbol id="ic-chat" viewBox="0 0 24 24">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </symbol>
    <symbol id="ic-walkin" viewBox="0 0 24 24">
      <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="8.5" cy="7" r="4"/>
      <line x1="20" y1="8" x2="20" y2="14"/>
      <line x1="17" y1="11" x2="23" y2="11"/>
    </symbol>
  </svg>

  <!-- 左サイドバー -->
  <aside class="rail" id="rail">
    <div class="rail-logo" data-i18n="appTitle"></div>
    <button class="rail-btn" data-view="customers">
      <span class="rail-ic"><svg class="ic"><use href="#ic-users"/></svg></span>
      <span class="rail-label" data-i18n="customers"></span>
    </button>
    <button class="rail-btn" id="railSettings">
      <span class="rail-ic"><svg class="ic"><use href="#ic-gear"/></svg></span>
      <span class="rail-label" data-i18n="settings"></span>
    </button>
    <button class="rail-btn" data-view="sites">
      <span class="rail-ic"><svg class="ic"><use href="#ic-globe"/></svg></span>
      <span class="rail-label" data-i18n="sites"></span>
    </button>
    <button class="rail-btn" data-view="chat">
      <span class="rail-ic"><svg class="ic"><use href="#ic-chat"/></svg></span>
      <span class="rail-label" data-i18n="chat"></span>
    </button>
    <div class="spacer"></div>
  </aside>

  <div class="app-main">
    <header class="topbar">
      <div class="date-nav">
        <button id="btnPrevDay" class="nav-btn">‹</button>
        <label class="date-box">
          <span id="dateDisplay"></span>
          <input type="date" id="datePicker">
        </label>
        <button id="btnNextDay" class="nav-btn">›</button>
        <button id="btnToday" class="btn ghost small" data-i18n="today"></button>
      </div>

      <nav class="view-switch" id="viewSwitch">
        <button class="vs-btn active" data-view="timetable" data-i18n="timetable"></button>
        <button class="vs-btn" data-view="list" data-i18n="list"></button>
      </nav>

      <div class="topbar-right">
        <span class="day-summary" id="daySummary"></span>
        <button id="btnChatPhone" class="icon-btn phone-only"><svg class="ic"><use href="#ic-chat"/></svg></button>
        <button id="btnSitesPhone" class="icon-btn phone-only"><svg class="ic"><use href="#ic-globe"/></svg></button>
        <button id="btnSettings" class="icon-btn phone-only"><svg class="ic"><use href="#ic-gear"/></svg></button>
        <div class="lang-switch" id="langSwitch">
          <button data-lang="ja">日本語</button>
          <button data-lang="vi">Tiếng Việt</button>
        </div>
      </div>
    </header>

    <main>
      <section id="view-timetable" class="view">
        <div class="tt-scroll" id="ttScroll"></div>
        <div class="legend" id="legend"></div>
      </section>

      <section id="view-list" class="view hidden">
        <div class="list-wrap" id="listWrap"></div>
      </section>

      <section id="view-customers" class="view hidden">
        <div class="cust-toolbar">
          <input type="search" id="custSearch" class="search-input" data-i18n-placeholder="searchPlaceholder">
        </div>
        <div class="cust-wrap" id="custWrap"></div>
      </section>

      <section id="view-sites" class="view hidden">
        <div class="sites-wrap">
          <p class="sites-note" data-i18n="sitesNote"></p>
          <div class="site-cards" id="siteCards"></div>
          <button class="btn ghost" id="btnAddSite"><svg class="ic"><use href="#ic-plus"/></svg> <span data-i18n="addSite"></span></button>
          <h3 class="inv-heading" data-i18n="invHeading"></h3>
          <p class="inv-note" data-i18n="invNote"></p>
          <div class="inv-scroll" id="invGrid"></div>
        </div>
      </section>

      <section id="view-chat" class="view hidden">
        <div class="chat-log" id="chatLog"></div>
        <div class="chat-inputbar">
          <input type="text" id="chatInput" data-i18n-placeholder="chatPlaceholder" autocomplete="off">
          <button class="btn primary" id="chatSend" data-i18n="chatSend"></button>
        </div>
      </section>
    </main>
  </div>

  <!-- スマホ用 下部ナビ / FAB -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="bn-btn active" data-view="timetable"><span class="bn-ic"><svg class="ic"><use href="#ic-calendar"/></svg></span><span data-i18n="timetable"></span></button>
    <button class="bn-btn" data-view="list"><span class="bn-ic"><svg class="ic"><use href="#ic-list"/></svg></span><span data-i18n="list"></span></button>
    <button class="bn-btn" data-view="customers"><span class="bn-ic"><svg class="ic"><use href="#ic-users"/></svg></span><span data-i18n="customers"></span></button>
  </nav>
  <div class="fabs">
    <button id="fabWalkIn" class="fab secondary" title="walk-in"><svg class="ic"><use href="#ic-walkin"/></svg></button>
    <button id="fabNew" class="fab primary" title="new"><svg class="ic"><use href="#ic-plus"/></svg></button>
  </div>

  <!-- 空きマスタップ時のポップオーバー（トレタ風） -->
  <div class="cell-popover hidden" id="cellPopover">
    <div class="cp-head">
      <button class="cp-tab active" id="cpTabRes" data-i18n="resTab"></button>
      <button class="cp-tab" id="cpTabWalkIn" data-i18n="walkIn"></button>
    </div>
    <div class="cp-info" id="cpInfo"></div>
    <div class="cp-pax" id="cpPax"></div>
    <button class="cp-block" id="cpBlock">🚫 <span data-i18n="blockBtn"></span></button>
  </div>

  <!-- Reservation modal -->
  <div class="modal-backdrop hidden" id="resModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="resModalTitle"></h2>
        <button class="icon-btn" id="btnResClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="status-row hidden" id="fStatusRow"></div>

        <div class="form-grid">
          <h3 class="sec" data-i18n="secWhen"></h3>
          <div class="field">
            <label data-i18n="date"></label>
            <input type="date" id="fDate">
          </div>
          <div class="field">
            <label data-i18n="startTime"></label>
            <select id="fStart"></select>
          </div>
          <div class="field">
            <label data-i18n="stayTime"></label>
            <select id="fDur"></select>
          </div>
          <div class="field">
            <label data-i18n="resetTime"></label>
            <select id="fReset"></select>
          </div>
          <div class="field checkbox-field">
            <label class="chk"><input type="checkbox" id="fHasLimit"> <span data-i18n="hasTimeLimit"></span></label>
          </div>

          <div class="field">
            <label data-i18n="adults"></label>
            <div class="stepper">
              <button type="button" class="step-btn" data-step="adults" data-d="-1">−</button>
              <span class="step-val" id="fAdults">2</span>
              <button type="button" class="step-btn" data-step="adults" data-d="1">＋</button>
            </div>
          </div>
          <div class="field">
            <label data-i18n="children"></label>
            <div class="stepper">
              <button type="button" class="step-btn" data-step="children" data-d="-1">−</button>
              <span class="step-val" id="fChildren">0</span>
              <button type="button" class="step-btn" data-step="children" data-d="1">＋</button>
            </div>
          </div>
          <div class="field hide-phone-empty"></div>

          <h3 class="sec" data-i18n="secTable"></h3>
          <div class="field span3">
            <div class="table-chips" id="fTables"></div>
          </div>

          <h3 class="sec" data-i18n="secGuest"></h3>
          <div class="field">
            <label data-i18n="name"></label>
            <input type="text" id="fName">
          </div>
          <div class="field">
            <label data-i18n="nameKana"></label>
            <input type="text" id="fKana">
          </div>
          <div class="field">
            <label data-i18n="phone"></label>
            <input type="tel" id="fPhone" data-i18n-placeholder="phonePlaceholder">
          </div>
          <div class="field">
            <label data-i18n="gender"></label>
            <select id="fGender"></select>
          </div>
          <div class="field">
            <label data-i18n="company"></label>
            <input type="text" id="fCompany">
          </div>
          <div class="field">
            <label data-i18n="reservationName"></label>
            <input type="text" id="fResName">
          </div>
          <div class="field">
            <label data-i18n="email"></label>
            <input type="email" id="fEmail" data-i18n-placeholder="emailPlaceholder">
          </div>

          <h3 class="sec" data-i18n="secOther"></h3>
          <div class="field">
            <label data-i18n="channel"></label>
            <select id="fChannel"></select>
          </div>
          <div class="field">
            <label data-i18n="purpose"></label>
            <select id="fPurpose"></select>
          </div>
          <div class="field span3">
            <label data-i18n="coursesLabel"></label>
            <div id="fCourses"></div>
            <button type="button" class="btn ghost small" id="btnAddCourse" data-i18n="addCourse"></button>
          </div>
          <div class="field span3">
            <label data-i18n="tagsLabel"></label>
            <div class="table-chips" id="fTags"></div>
          </div>
          <div class="field span3">
            <label data-i18n="memo"></label>
            <textarea id="fMemo" rows="2"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn danger hidden" id="btnResDelete" data-i18n="delete"></button>
        <span class="spacer"></span>
        <button class="btn ghost" id="btnResCancel" data-i18n="cancelBtn"></button>
        <button class="btn primary" id="btnResSave" data-i18n="save"></button>
      </div>
    </div>
  </div>

  <!-- Table settings modal -->
  <div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2 data-i18n="settings"></h2>
        <button class="icon-btn" id="btnSetClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field">
            <label data-i18n="openTime"></label>
            <select id="sOpen"></select>
          </div>
          <div class="field">
            <label data-i18n="closeTime"></label>
            <select id="sClose"></select>
          </div>
        </div>
        <div class="tbl-head">
          <span data-i18n="tableName"></span>
          <span data-i18n="groupLabel"></span>
          <span data-i18n="seatsLabel"></span>
          <span data-i18n="minSeatsLabel"></span>
          <span></span>
        </div>
        <div id="tblRows"></div>
        <button class="btn ghost full" id="btnAddTable"><svg class="ic"><use href="#ic-plus"/></svg> <span data-i18n="addTable"></span></button>

        <h3 class="combo-heading" data-i18n="comboHeading"></h3>
        <p class="combo-note" data-i18n="comboNote"></p>
        <div id="comboRows"></div>
        <button class="btn ghost full" id="btnAddCombo"><svg class="ic"><use href="#ic-plus"/></svg> <span data-i18n="addCombo"></span></button>
      </div>
      <div class="modal-footer">
        <span class="spacer"></span>
        <button class="btn ghost" id="btnSetCancel" data-i18n="cancelBtn"></button>
        <button class="btn primary" id="btnSetSave" data-i18n="save"></button>
      </div>
    </div>
  </div>

  <!-- Site modal（予約サイトの追加・編集） -->
  <div class="modal-backdrop hidden" id="siteModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="siteModalTitle"></h2>
        <button class="icon-btn" id="btnSiteClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="field span2">
            <label data-i18n="siteName"></label>
            <input type="text" id="sName">
          </div>
          <div class="field">
            <label data-i18n="colorLabel"></label>
            <div class="color-swatches" id="sColors"></div>
          </div>
          <div class="field span3">
            <label data-i18n="linkedTables"></label>
            <div class="table-chips" id="sTables"></div>
          </div>
          <div class="field span3">
            <label data-i18n="linkedCombos"></label>
            <div class="table-chips" id="sCombos"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn danger hidden" id="btnSiteDelete" data-i18n="delete"></button>
        <span class="spacer"></span>
        <button class="btn ghost" id="btnSiteCancel" data-i18n="cancelBtn"></button>
        <button class="btn primary" id="btnSiteSave" data-i18n="save"></button>
      </div>
    </div>
  </div>

  <script src="i18n.js?v=24"></script>
  <script src="app.js?v=24"></script>
</body>
</html>
