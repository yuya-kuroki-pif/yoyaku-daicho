<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <title>ネット予約 / Đặt bàn trực tuyến</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans", system-ui, sans-serif;
      background: #f2f6fa; color: #1f2937; font-size: 16px;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
    .head { display: flex; align-items: center; gap: 10px; padding: 8px 0 16px; }
    .logo {
      width: 44px; height: 44px; border-radius: 12px; background: #f7b500;
      display: flex; align-items: center; justify-content: center; font-size: 22px;
    }
    .head h1 { font-size: 19px; flex: 1; }
    .lang { display: flex; border: 1px solid #d3dce4; border-radius: 8px; overflow: hidden; }
    .lang button { border: none; background: #fff; color: #6b7a88; padding: 8px 12px; font-size: 12.5px; cursor: pointer; }
    .lang button.active { background: #2563eb; color: #fff; font-weight: 700; }

    .card { background: #fff; border: 1px solid #e3e9ef; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
    .card h2 { font-size: 13px; color: #2563eb; font-weight: 700; margin-bottom: 10px; }
    input[type="date"], input[type="text"], input[type="tel"], textarea {
      width: 100%; border: 1px solid #d3dce4; border-radius: 10px;
      padding: 12px; font-size: 16px; min-height: 48px; font-family: inherit; background: #fff; color: #1f2937;
    }
    textarea { min-height: 64px; resize: vertical; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .grid button {
      border: 1px solid #d3dce4; background: #fff; border-radius: 10px;
      padding: 12px 4px; font-size: 15px; font-weight: 700; color: #1f2937; cursor: pointer; min-height: 48px;
    }
    .grid button.sel { background: #2563eb; border-color: #2563eb; color: #fff; }
    .grid button:disabled { background: #f0f3f6; color: #c2cbd1; cursor: default; }
    .grid.times { grid-template-columns: repeat(4, 1fr); }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; color: #6b7a88; font-weight: 600; margin-bottom: 6px; }
    .submit {
      width: 100%; border: none; border-radius: 12px; background: #2563eb; color: #fff;
      font-size: 17px; font-weight: 700; padding: 16px; cursor: pointer; min-height: 54px;
    }
    .submit:disabled { background: #c2cbd1; }
    .note { text-align: center; color: #6b7a88; font-size: 13px; margin-top: 10px; }
    .closed { text-align: center; padding: 60px 16px; color: #6b7a88; font-size: 16px; }
    .done { text-align: center; padding: 30px 8px; }
    .done .mark { font-size: 52px; }
    .done h2 { font-size: 20px; margin: 12px 0 6px; color: #16a34a; }
    .done p { color: #6b7a88; font-size: 14px; }
    .detail { text-align: left; background: #f6f9fb; border-radius: 12px; padding: 14px 16px; margin: 18px 0; font-size: 15px; line-height: 2; }
    .detail b { display: inline-block; min-width: 7em; color: #6b7a88; font-weight: 600; font-size: 13px; }
    .linkbtn { background: none; border: none; color: #2563eb; font-size: 14px; font-weight: 700; cursor: pointer; padding: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="logo">🍽</div>
      <h1 id="hTitle"></h1>
      <div class="lang">
        <button data-lang="ja">日本語</button>
        <button data-lang="vi">Tiếng Việt</button>
      </div>
    </div>
    <div id="content"></div>
  </div>

  <script>
    'use strict';
    /* 自社予約サイト（お客様向け）。予約台帳と同じ localStorage を共有し、
     * ネット予約は台帳に「予約」として自動反映されます。 */
    const LS_KEY = 'yoyaku-daicho-v1';
    const DUR = 120; // 滞在想定（分）

    const T = {
      ja: {
        title: 'ネット予約', date: '日付', pax: '人数', time: '時間',
        name: 'お名前', phone: '電話番号', memo: 'ご要望（任意）',
        submit: 'この内容で予約する', required: 'お名前を入力してください',
        closed: '現在ネット予約を受け付けておりません。お電話にてお問い合わせください。',
        noData: 'ただいま準備中です。', noSlot: '選択できる時間がありません',
        done: 'ご予約を受け付けました', doneSub: 'ご来店を心よりお待ちしております。',
        back: '新しい予約をする', taken: '申し訳ありません、その時間は埋まりました。別の時間をお選びください。',
        pax_(n) { return `${n}名`; },
        date_(y, m, d, wd) { return `${y}年${m}月${d}日（${['日','月','火','水','木','金','土'][wd]}）`; },
      },
      vi: {
        title: 'Đặt bàn trực tuyến', date: 'Ngày', pax: 'Số khách', time: 'Giờ',
        name: 'Tên khách', phone: 'Số điện thoại', memo: 'Yêu cầu (tùy chọn)',
        submit: 'Xác nhận đặt bàn', required: 'Vui lòng nhập tên khách',
        closed: 'Hiện không nhận đặt bàn trực tuyến. Vui lòng gọi điện cho cửa hàng.',
        noData: 'Đang chuẩn bị.', noSlot: 'Không có khung giờ trống',
        done: 'Đã nhận đặt bàn!', doneSub: 'Rất mong được đón tiếp quý khách.',
        back: 'Đặt bàn mới', taken: 'Rất tiếc, khung giờ đó vừa kín. Vui lòng chọn giờ khác.',
        pax_(n) { return `${n} khách`; },
        date_(y, m, d, wd) { return `${['CN','T2','T3','T4','T5','T6','T7'][wd]}, ${String(d).padStart(2,'0')}/${String(m).padStart(2,'0')}/${y}`; },
      },
    };

    let lang = 'ja';
    let selDate = todayStr();
    let selPax = 2;
    let selTime = null;
    let doneRes = null;

    function t(k) { return T[lang][k] ?? T.ja[k] ?? k; }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
    function fmtTime(min) { return `${pad2(Math.floor(min/60))}:${pad2(min%60)}`; }
    function uid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
    function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function db() {
      try { return JSON.parse(localStorage.getItem(LS_KEY)); } catch (e) { return null; }
    }
    /* URLの ?site= で経路（Instagram/Googleマップ等）を指定。無指定は自社予約サイト */
    const siteParam = new URLSearchParams(location.search).get('site');
    function ownSite(st) {
      const sites = st.sites || [];
      return sites.find(s => s.id === siteParam) || sites.find(s => s.own);
    }

    /* 指定日時・人数で確保するテーブルを決定（1卓 → 結合テーブルの順に探す）
     * 戻り値: 確保するテーブルIDの配列 / 空きがなければ null */
    function findAssignment(st, site, date, start, pax) {
      const actives = st.reservations.filter(r =>
        r.date === date && r.status !== 'cancelled' && r.status !== 'noshow');
      const isFree = (id) => !actives.some(r =>
        (r.tableIds || []).includes(id) && r.start < start + DUR && start < r.start + r.duration);
      const linked = new Set(site.tableIds);

      // 1卓で入る場合は人数に近い席から（予約最少人数の条件も満たすこと）
      const singles = st.tables
        .filter(tb => linked.has(tb.id) && tb.seats >= pax && (tb.min || 1) <= pax && isFree(tb.id));
      if (singles.length) {
        singles.sort((a, b) => a.seats - b.seats);
        return [singles[0].id];
      }

      // 結合テーブル（合席）: 全卓がこのサイトに連携済みかつ空いていること
      const combos = (st.combos || []).filter(c =>
        (c.max || 0) >= pax &&
        (c.min || 1) <= pax &&
        c.tableIds.length >= 2 &&
        c.tableIds.every(id => linked.has(id) && st.tables.some(tb => tb.id === id) && isFree(id)));
      if (combos.length) {
        combos.sort((a, b) => a.max - b.max);
        return [...combos[0].tableIds];
      }
      return null;
    }

    function render() {
      document.getElementById('hTitle').textContent = t('title');
      document.title = t('title');
      document.documentElement.lang = lang;
      document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));

      const el = document.getElementById('content');
      const st = db();
      if (!st) { el.innerHTML = `<div class="closed">${esc(t('noData'))}</div>`; return; }
      const site = ownSite(st);
      if (!site || !site.enabled) { el.innerHTML = `<div class="closed">${esc(t('closed'))}</div>`; return; }

      if (doneRes) { renderDone(el); return; }

      const { openMin, closeMin } = st.settings;
      const lastStart = closeMin - DUR;
      const now = new Date();
      const nowMin = now.getHours() * 60 + now.getMinutes();

      let timesHtml = '';
      for (let m = openMin; m <= lastStart; m += 30) {
        if (selDate === todayStr() && m < nowMin) continue;
        const ok = !!findAssignment(st, site, selDate, m, selPax);
        const sel = selTime === m ? ' sel' : '';
        timesHtml += `<button type="button" data-time="${m}" ${ok ? '' : 'disabled'} class="${sel.trim()}">${fmtTime(m)}</button>`;
      }

      el.innerHTML =
        `<div class="card"><h2>${esc(t('date'))}</h2><input type="date" id="bDate" value="${selDate}" min="${todayStr()}"></div>` +
        `<div class="card"><h2>${esc(t('pax'))}</h2><div class="grid" id="bPax">` +
          [1,2,3,4,5,6,7,8].map(n => `<button type="button" data-pax="${n}" class="${selPax === n ? 'sel' : ''}">${esc(T[lang].pax_(n))}</button>`).join('') +
        `</div></div>` +
        `<div class="card"><h2>${esc(t('time'))}</h2>` +
          (timesHtml ? `<div class="grid times" id="bTimes">${timesHtml}</div>` : `<div class="note">${esc(t('noSlot'))}</div>`) +
        `</div>` +
        `<div class="card">` +
          `<div class="field"><label>${esc(t('name'))}</label><input type="text" id="bName"></div>` +
          `<div class="field"><label>${esc(t('phone'))}</label><input type="tel" id="bPhone" placeholder="090-0000-0000"></div>` +
          `<div class="field"><label>${esc(t('memo'))}</label><textarea id="bMemo"></textarea></div>` +
        `</div>` +
        `<button class="submit" id="bSubmit" ${selTime == null ? 'disabled' : ''}>${esc(t('submit'))}</button>`;

      document.getElementById('bDate').addEventListener('change', (e) => {
        if (e.target.value) { selDate = e.target.value; selTime = null; keepInputs(render); }
      });
      document.getElementById('bPax').addEventListener('click', (e) => {
        const b = e.target.closest('[data-pax]');
        if (b) { selPax = Number(b.dataset.pax); selTime = null; keepInputs(render); }
      });
      const times = document.getElementById('bTimes');
      if (times) {
        times.addEventListener('click', (e) => {
          const b = e.target.closest('[data-time]');
          if (b && !b.disabled) { selTime = Number(b.dataset.time); keepInputs(render); }
        });
      }
      document.getElementById('bSubmit').addEventListener('click', submit);
    }

    /* 再描画しても入力途中の名前等を保持する */
    let saved = { name: '', phone: '', memo: '' };
    function keepInputs(fn) {
      saved = {
        name: document.getElementById('bName')?.value ?? saved.name,
        phone: document.getElementById('bPhone')?.value ?? saved.phone,
        memo: document.getElementById('bMemo')?.value ?? saved.memo,
      };
      fn();
      document.getElementById('bName') && (document.getElementById('bName').value = saved.name);
      document.getElementById('bPhone') && (document.getElementById('bPhone').value = saved.phone);
      document.getElementById('bMemo') && (document.getElementById('bMemo').value = saved.memo);
    }

    function submit() {
      const name = document.getElementById('bName').value.trim();
      if (!name) { alert(t('required')); return; }
      if (selTime == null) return;

      const st = db();
      const site = ownSite(st);
      if (!site || !site.enabled) { render(); return; }
      const assign = findAssignment(st, site, selDate, selTime, selPax);
      if (!assign) { alert(t('taken')); selTime = null; keepInputs(render); return; }

      const res = {
        id: uid(),
        date: selDate,
        start: selTime,
        duration: DUR,
        adults: selPax,
        children: 0,
        name,
        kana: '',
        phone: document.getElementById('bPhone').value.trim(),
        tableIds: assign,
        course: '',
        memo: document.getElementById('bMemo').value.trim(),
        status: 'reserved',
        walkIn: false,
        channel: site.id,
      };
      st.reservations.push(res);
      localStorage.setItem(LS_KEY, JSON.stringify(st));
      doneRes = res;
      saved = { name: '', phone: '', memo: '' };
      render();
    }

    function renderDone(el) {
      const [y, m, d] = doneRes.date.split('-').map(Number);
      const wd = new Date(y, m - 1, d).getDay();
      el.innerHTML =
        `<div class="card done">` +
          `<div class="mark">✅</div>` +
          `<h2>${esc(t('done'))}</h2>` +
          `<p>${esc(t('doneSub'))}</p>` +
          `<div class="detail">` +
            `<div><b>${esc(t('date'))}</b>${esc(T[lang].date_(y, m, d, wd))}</div>` +
            `<div><b>${esc(t('time'))}</b>${fmtTime(doneRes.start)}〜</div>` +
            `<div><b>${esc(t('pax'))}</b>${esc(T[lang].pax_(doneRes.adults))}</div>` +
            `<div><b>${esc(t('name'))}</b>${esc(doneRes.name)}</div>` +
          `</div>` +
          `<button class="linkbtn" id="bBack">${esc(t('back'))}</button>` +
        `</div>`;
      document.getElementById('bBack').addEventListener('click', () => { doneRes = null; selTime = null; render(); });
    }

    document.querySelector('.lang').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-lang]');
      if (b) { lang = b.dataset.lang; keepInputs(render); }
    });

    render();
  </script>
</body>
</html>
