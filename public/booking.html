<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src 'self' https://places.googleapis.com https://*.supabase.co wss://*.supabase.co; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#e8710a">
  <title>ネット予約 / Đặt bàn trực tuyến</title>
  <link rel="stylesheet" href="booking.css?v=7">
</head>
<body>
  <!-- 自社予約サイト（お客様向け・グルメサイト風の店舗ページ）
       予約台帳と同じ localStorage を共有し、ネット予約は台帳に「予約」として自動反映されます。
       店舗情報・コース・写真は台帳の「店舗情報」設定、口コミ・評価・写真の一部は Google マップ（Places API）から取得します。
       URL の ?site= で経路（Instagram / Googleマップ 等）を指定、#reserve で予約画面を直接開けます。 -->
  <header class="site-head">
    <div class="wrap">
      <div class="crumb" id="crumb"></div>
      <div class="sh-row">
        <div class="sh-main">
          <h1 id="hTitle"></h1>
          <div class="sh-kana" id="hKana"></div>
        </div>
        <div class="lang" id="langSwitch">
          <button type="button" data-lang="ja">日本語</button>
          <button type="button" data-lang="vi">Tiếng Việt</button>
        </div>
      </div>
      <div class="sh-rating" id="hRating"></div>
      <div class="sh-meta" id="hMeta"></div>
      <div class="sh-badges" id="hBadges"></div>
    </div>
    <nav class="site-tabs" id="siteTabs">
      <div class="wrap tabs-inner">
        <button type="button" data-tab="top"></button>
        <button type="button" data-tab="menu"></button>
        <button type="button" data-tab="photo"></button>
        <button type="button" data-tab="review"></button>
        <button type="button" data-tab="map"></button>
      </div>
    </nav>
  </header>

  <div class="layout wrap">
    <main id="content"></main>
    <aside class="side" id="side"></aside>
  </div>

  <div class="cta-bar" id="ctaBar">
    <div class="wrap cta-inner">
      <a class="cta-call" id="ctaCall" href="#" hidden></a>
      <button type="button" class="cta-reserve" id="ctaReserve"></button>
    </div>
  </div>

  <footer class="foot wrap" id="foot"></footer>

  <script src="vendor/supabase.js"></script>
  <script src="config.js?v=1"></script>
  <script src="store.js?v=3"></script>
  <script src="i18n.js?v=40"></script>
  <script src="booking.js?v=16"></script>
</body>
</html>
